name: Deploy to Yandex Cloud
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Sync data folder
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync ./data/ s3://${{ secrets.YANDEX_BUCKET_NAME }}/data/ \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete
      - name: Sync media folder
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync ./media/ s3://${{ secrets.YANDEX_BUCKET_NAME }}/media/ \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete
      - name: Sync root JSON files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync ./ s3://${{ secrets.YANDEX_BUCKET_NAME }}/ \
            --endpoint-url=https://storage.yandexcloud.net \
            --exclude "*" \
            --include "dl_status.json" \
            --include "hs_status.json" \
            --include "inv_status.json" \
            --include "tt_status.json" \
            --include "wl_status.json"
